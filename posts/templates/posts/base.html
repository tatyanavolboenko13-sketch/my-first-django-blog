<!DOCTYPE html>
<html>
<head>
    <title>Мой блог</title>
</head>
<body>
    <h1><a href="/">Мой блог</a></h1>

    <div style="margin-bottom: 10px;">
        {% if user.is_authenticated %}
            Привет, {{ user.username }}!
            <a href="{% url 'logout' %}">Выйти</a>
            <a href="{% url 'post_create' %}" style="margin-left: 15px; background: #007bff; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px;">+ Новый пост</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a> |
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </div>
    <hr>
    {% block content %}
    {% endblock %}
</body>
</html>
